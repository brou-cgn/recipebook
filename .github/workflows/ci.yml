name: CI

# Guards the test suite on every pull request into main, and is the only gate
# before a merge reaches production: a merge triggers Auto Version Bump, and
# a successful bump triggers the Firebase deploy. Nothing checks main again on
# the way out, so a red check here is the last chance to stop a bad release.
#
# Runs `npm run test:ci`, not `npm test`: suites listed in
# scripts/quarantined-tests.js are skipped. The list has been empty since
# 2026-10-17; a new entry needs a date and a reason - see the file's header.
#
# No `push: main` trigger on purpose: main only moves through merged pull
# requests - which were checked here before the merge - plus the version-bump
# commits, which carry [skip ci] anyway. A post-merge run would repeat the
# pull request run and nothing else reads its result. workflow_dispatch stays
# as the manual valve for checking main itself.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A rapid series of pushes to a pull request should leave one running check,
# not a queue of doomed ones - the previous attempt at CI here produced mostly
# "cancelled" runs because merges outran them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ESLint für src/ (Tech-Check B2): react-hooks/rules-of-hooks, no-undef u. a.
      # Nur Fehler brechen ab; Warnungen (npm run lint) sind der sichtbare Altbestand.
      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm run test:ci

      # Vite build (Tech-Check B1). Fails on broken imports - e.g. a name that a
      # module does not export - which the former create-react-app build only
      # reported as a warning.
      - name: Build
        run: npm run build

  # Cloud Functions haben ein eigenes package.json und wurden bis Tech-Check F1
  # (2026-10-14) von keiner CI berührt. Tests laufen über functions/test-ci.js
  # (Quarantäne in functions/quarantined-tests.js), Lint mit eslint:recommended
  # über functions/.eslintrc.js – ohne Stilregeln (Tech-Check F11).
  functions:
    name: Functions Tests & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # --ignore-scripts + Skip: puppeteer/sharp-Downloads werden für die Tests nicht gebraucht.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint:ci

      - name: Run tests
        run: npm run test:ci

  # firestore.rules ist die kritischste Sicherheitsfläche und hatte bis Phase 0 des
  # Follow-Vorhabens (2026-10-18) keine Tests. Läuft gegen den Firestore-Emulator
  # (braucht Java 21), siehe rules-tests/ und docs/architecture/security.md.
  rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rules-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rules-tests/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests
        run: npm test
