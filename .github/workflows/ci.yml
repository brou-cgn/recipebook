name: CI

# Guards the test suite on every pull request into main, and is the only gate
# before a merge reaches production: a merge triggers Auto Version Bump, and
# a successful bump triggers the Firebase deploy. Nothing checks main again on
# the way out, so a red check here is the last chance to stop a bad release.
#
# Runs `npm run test:ci`, not `npm test`: a list of known-failing suites is
# quarantined in scripts/quarantined-tests.js, so that the 110 suites that do
# pass are protected today instead of after a repair marathon. Working that
# list down is the point - see the file's header.
#
# No `push: main` trigger on purpose: main only moves through merged pull
# requests - which were checked here before the merge - plus the version-bump
# commits, which carry [skip ci] anyway. A post-merge run would repeat the
# pull request run and nothing else reads its result. workflow_dispatch stays
# as the manual valve for checking main itself.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A rapid series of pushes to a pull request should leave one running check,
# not a queue of doomed ones - the previous attempt at CI here produced mostly
# "cancelled" runs because merges outran them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      # CI=false because create-react-app treats warnings as errors when CI is
      # set, and the project carries pre-existing no-unused-vars warnings. Same
      # setting the Firebase deploy workflow uses - this step checks that it
      # compiles, not that it is warning-free.
      - name: Build
        env:
          CI: false
        run: npm run build
