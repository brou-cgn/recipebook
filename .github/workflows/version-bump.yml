name: Auto Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version-Sprung erzwingen (auto = aus den Commit-Titeln ableiten)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      bump_type: ${{ steps.determine-bump.outputs.bump_type }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      
      - name: Get last version tag
        id: get-last-tag
        run: |
          # Get the last version tag (if any)
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous version tag found"
            echo "last_tag=" >> $GITHUB_OUTPUT
          else
            echo "Last version tag: $LAST_TAG"
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          fi
      
      - name: Get commits since last tag
        id: get-commits
        run: |
          LAST_TAG="${{ steps.get-last-tag.outputs.last_tag }}"
          if [ -z "$LAST_TAG" ]; then
            # No tags yet, get all commits
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi
          
          # Check if there are any commits
          if [ -z "$COMMITS" ]; then
            echo "No new commits found"
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "Commits since last tag:"
            echo "$COMMITS"
          fi
          
          # Save commits to file for next step
          echo "$COMMITS" > /tmp/commits.txt
      
      - name: Determine version bump type
        id: determine-bump
        env:
          FORCED_BUMP: ${{ inputs.bump_type }}
        run: |
          # Manueller Lauf mit festem Sprung (Release-Entscheidung)
          if [ -n "$FORCED_BUMP" ] && [ "$FORCED_BUMP" != "auto" ]; then
            echo "Bump erzwungen: $FORCED_BUMP"
            echo "bump_type=$FORCED_BUMP" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.get-commits.outputs.has_commits }}" = "false" ]; then
            echo "No commits to analyze, defaulting to patch"
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          COMMITS=$(cat /tmp/commits.txt)
          BUMP_TYPE="patch"
          
          # Check for BREAKING CHANGE (major)
          if echo "$COMMITS" | grep -qi "BREAKING CHANGE\|^[a-z]*!:"; then
            BUMP_TYPE="major"
            echo "🚨 BREAKING CHANGE detected - MAJOR version bump"
          # Check for feat: (minor)
          elif echo "$COMMITS" | grep -qi "^feat\|^feature"; then
            BUMP_TYPE="minor"
            echo "✨ New feature detected - MINOR version bump"
          # Check for fix: (patch)
          elif echo "$COMMITS" | grep -qi "^fix\|^bugfix\|^patch\|^perf\|^refactor\|^docs\|^chore"; then
            BUMP_TYPE="patch"
            echo "🐛 Fix/patch detected - PATCH version bump"
          else
            BUMP_TYPE="patch"
            echo "ℹ️  No conventional commit found - defaulting to PATCH"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
      
      # Kein Commit auf main: ein Branch-Ruleset mit Pflicht-PR und Pflicht-Check
      # blockiert Direkt-Pushes des github-actions-Bots. Die Version lebt
      # deshalb nur als Git-Tag (Tags fallen nicht unter das Branch-Ruleset).
      # Die package.json-Version wird nicht mehr gepflegt; der Deploy liest
      # den juengsten Tag.
      - name: Tag new version
        id: bump
        run: |
          BUMP_TYPE="${{ steps.determine-bump.outputs.bump_type }}"
          # Fallback fuer den allerersten Lauf ohne Tag
          PKG_VERSION=$(node -p "require('./package.json').version")

          for i in 1 2 3; do
            git fetch --tags --force origin

            # Rerun auf demselben Commit: dort steht schon ein Version-Tag
            # (ein manuell erzwungener Sprung vergibt trotzdem eine neue Version)
            EXISTING=$(git tag --points-at HEAD --list "v*" | head -n 1)
            if [ -n "$EXISTING" ] && [ "${{ inputs.bump_type || 'auto' }}" = "auto" ]; then
              echo "Commit traegt bereits $EXISTING, nichts zu tun"
              echo "new_version=${EXISTING#v}" >> $GITHUB_OUTPUT
              exit 0
            fi

            LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
            BASE="${LAST_TAG#v}"
            BASE="${BASE:-$PKG_VERSION}"

            NEW_VERSION=$(node -e '
              const [a, b, c] = process.argv[1].split(".").map(Number);
              const t = process.argv[2];
              console.log(t === "major" ? [a + 1, 0, 0].join(".")
                        : t === "minor" ? [a, b + 1, 0].join(".")
                        : [a, b, c + 1].join("."));
            ' "$BASE" "$BUMP_TYPE")
            echo "Version: $BASE -> $NEW_VERSION ($BUMP_TYPE)"

            git tag "v$NEW_VERSION"
            # Nur diesen einen Tag pushen. Schlaegt der Push fehl (paralleler
            # Lauf hat dieselbe Nummer vergeben), neu berechnen.
            if git push origin "refs/tags/v$NEW_VERSION"; then
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              exit 0
            fi
            git tag -d "v$NEW_VERSION" 2>/dev/null || true
            echo "Retry $i failed, waiting..."
            sleep 5
          done
          echo "All retries failed, tag push unsuccessful."
          exit 1

      - name: Create version summary
        run: |
          echo "## 🎉 Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ steps.determine-bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
