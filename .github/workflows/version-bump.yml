name: Auto Version Bump

# Tags each merge to main as v<x.y.z>, with the bump type derived from the
# commit subjects since the previous tag.
#
# This workflow used to also commit the new number into package.json and push
# that commit to main. It cannot any more: the branch ruleset on main requires
# every change to arrive via a pull request with a passing check, and
# github-actions[bot] cannot be exempted from it - it is not an installable
# GitHub App, so it does not appear in a ruleset's bypass list at all.
#
# Rather than work around that (a personal access token would, until it
# silently expires a year later), the tag is now the only release marker.
# It always was one - this workflow created the same tag alongside the commit
# before. Pushing a tag is not a branch update, so the ruleset does not apply.
# scripts/appVersion.js reads the version back out of it for the build.
#
# Side effect worth having: the old "push changes" step needed three retries
# with a fetch/reset/re-apply loop, because a commit racing other merges to
# main conflicts. A tag cannot conflict with anything, so that is all gone.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      bump_type: ${{ steps.determine-bump.outputs.bump_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history and tags: the bump type comes from the commits since
          # the previous tag, and the version itself from the tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get commits since last tag
        id: get-commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous version tag found - considering all commits"
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            echo "Last version tag: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since the last tag"
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "Commits since last tag:"
            echo "$COMMITS"
          fi

          echo "$COMMITS" > /tmp/commits.txt

      - name: Determine version bump type
        id: determine-bump
        run: |
          if [ "${{ steps.get-commits.outputs.has_commits }}" = "false" ]; then
            echo "No commits to analyze, defaulting to patch"
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS=$(cat /tmp/commits.txt)
          BUMP_TYPE="patch"

          if echo "$COMMITS" | grep -qi "BREAKING CHANGE\|^[a-z]*!:"; then
            BUMP_TYPE="major"
            echo "🚨 BREAKING CHANGE detected - MAJOR version bump"
          elif echo "$COMMITS" | grep -qi "^feat\|^feature"; then
            BUMP_TYPE="minor"
            echo "✨ New feature detected - MINOR version bump"
          elif echo "$COMMITS" | grep -qi "^fix\|^bugfix\|^patch\|^perf\|^refactor\|^docs\|^chore"; then
            BUMP_TYPE="patch"
            echo "🐛 Fix/patch detected - PATCH version bump"
          else
            BUMP_TYPE="patch"
            echo "ℹ️  No conventional commit found - defaulting to PATCH"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Determine new version
        id: bump
        run: |
          BUMP_TYPE="${{ steps.determine-bump.outputs.bump_type }}"
          CURRENT_VERSION=$(node scripts/appVersion.js current)
          NEW_VERSION=$(node scripts/appVersion.js next "$BUMP_TYPE")
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Reruns and repeated dispatches must not fail on an existing tag.
          if git ls-remote --tags origin "refs/tags/v$NEW_VERSION" | grep -q .; then
            echo "✅ Tag v$NEW_VERSION already exists on the remote, nothing to do"
            exit 0
          fi

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "✅ Pushed tag v$NEW_VERSION"

      - name: Create version summary
        run: |
          echo "## 🎉 Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ steps.determine-bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created**: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
