name: Deploy to Firebase Hosting

# Der einzige Deploy-Pfad des Projekts. Die Kette:
#
#   Pull Request  ->  CI (Tests + Build, ci.yml)
#   Merge auf main ->  Auto Version Bump (version-bump.yml)
#   Bump erfolgreich -> dieser Workflow
#
# Warum am Version Bump und nicht direkt am Merge: der Bump schreibt die neue
# Versionsnummer in die package.json und pusht sie als eigenen Commit. Erst
# danach kann hier REACT_APP_VERSION korrekt gesetzt werden. Haengt man den
# Deploy an den Merge, geht die alte Version live.
#
# Aus demselben Grund wird `main` ausgecheckt und nicht der ausloesende SHA:
# der ausloesende SHA ist der Merge-Commit, die Version steht im Bump-Commit
# darueber.
#
# Getestet wird im Pull Request, nicht hier. Wer direkt auf main pusht,
# umgeht damit die Tests und deployt ungeprueft - main sollte sich
# ausschliesslich durch gemergte Pull Requests bewegen.

on:
  workflow_run:
    workflows: ["Auto Version Bump"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Deploys duerfen sich nie ueberholen und laufende Deploys nie abgebrochen
# werden: ein mitten im `firebase deploy` gekillter Lauf hinterlaesst Hosting,
# Functions und Rules in unterschiedlichen Staenden.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Ein fehlgeschlagener Version Bump heisst: main ist nicht in dem Zustand,
    # den wir ausliefern wollten.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "npm ci attempt $attempt/$max_attempts"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 60000

      # CI=false, weil create-react-app Warnungen als Fehler behandelt, sobald
      # CI gesetzt ist - das Projekt traegt bestehende no-unused-vars-Warnungen.
      - name: Build
        env:
          CI: false
          REACT_APP_VERSION: ${{ steps.version.outputs.version }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_FIREBASE_VAPID_KEY: ${{ secrets.REACT_APP_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Install Functions dependencies
        run: npm ci
        working-directory: ./functions
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      # Die Wiederholungen fangen ausschliesslich bekannte Flakiness der
      # Firebase-APIs ab (503, Timeouts, "Failed to list functions"). Ein
      # inhaltlicher Fehler bricht sofort ab, statt dreimal dasselbe zu
      # versuchen.
      - name: Deploy (Hosting, Functions, Firestore Rules & Indexes)
        run: |
          max_attempts=3
          firebase_project="broubook"
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Firebase deploy attempt $attempt/$max_attempts"
            set +e
            deploy_output=$(firebase deploy --only hosting,functions,firestore:rules,firestore:indexes --project "$firebase_project" --force 2>&1)
            deploy_exit_code=$?
            set -e
            echo "$deploy_output"

            if [ "$deploy_exit_code" -eq 0 ]; then
              exit 0
            fi

            # Erneuter Deploy desselben Builds: Hosting lehnt ab, weil die
            # Version bereits aktiv ist. Das ist der gewuenschte Zustand.
            if echo "$deploy_output" | grep -Fq "Can't release to" \
              && echo "$deploy_output" | grep -Fq "is the current active version."; then
              echo "Hosting release version is already active. Treating deploy as successful."
              exit 0
            fi

            if echo "$deploy_output" | grep -Fiq "Failed to list functions"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Firebase failed to list functions (transient API error). Retrying in 15s..."
                sleep 15
                continue
              fi
            fi

            if echo "$deploy_output" | grep -Eiq "Failed to make request to .*serviceusage\.googleapis\.com|HTTP Error: 503|Service Unavailable"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                case "$attempt" in
                  1) sleep_seconds=10 ;;
                  *) sleep_seconds=20 ;;
                esac
                echo "Transient Firebase API error. Retrying in ${sleep_seconds}s..."
                sleep "$sleep_seconds"
                continue
              fi
            fi

            if echo "$deploy_output" | grep -Eiq "timed out after"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "A Cloud Functions deploy task timed out. Retrying in 15s..."
                sleep 15
                continue
              fi
            fi

            exit "$deploy_exit_code"
          done
          exit 1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Firebase Deploy"
            echo ""
            echo "- **Version**: v${{ steps.version.outputs.version }}"
            echo "- **Ausgeloest durch**: ${{ github.event_name }}"
            echo "- **Live**: https://broubook.web.app"
          } >> $GITHUB_STEP_SUMMARY
