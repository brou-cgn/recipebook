# Abhängigkeits-Updates (Tech-Check F15). Bis Oktober 2026 fielen neue
# Sicherheitsmeldungen nur bei manuellem npm audit auf.
#
# Je Ordner höchstens ein gruppierter PR pro Woche für Minor- und Patch-Updates,
# damit nicht jedes Paket einen eigenen PR, eine Version und einen Deploy
# auslöst (Tech-Check W2). Major-Updates kommen einzeln, weil sie Code-Änderungen
# brauchen können. Sicherheits-PRs zu bekannten Lücken schaltet GitHub getrennt
# frei (Settings → Code security → Dependabot security updates).
#
# Commit-Präfix chore: zählt im Versions-Workflow als Patch (AGENTS.md, Versionierung).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /rules-tests
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rules-tests:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
