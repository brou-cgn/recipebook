<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Advent Glow – Antworten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Swash:wght@400;700&family=Amatic+SC:wght@700&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FCFAF6;
  --ink:#4E5F55;
  --ink-soft:#7A887F;
  --sage:#DFE8E1;
  --gold:#B08A3E;
  --line:#C9D3CC;
  --danger:#9A3B2E;
  --display:"Cherry Swash", Georgia, serif;
  --hand:"Amatic SC", "Arial Narrow", sans-serif;
  --body:"Quicksand", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 56px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;position:relative}
.deco{position:absolute;height:auto;pointer-events:none}
.spin{animation:spin 28s linear infinite}
.twinkle{animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%{transform:scale(.88) rotate(-8deg);opacity:.75}100%{transform:scale(1.1) rotate(8deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.spin,.twinkle{animation:none}}

h1{margin:8px 0 0;font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.1;padding-right:72px}
.sub{margin:-12px 0 0;font-family:var(--hand);font-size:1.6rem;color:var(--ink-soft);line-height:1}
.card{border:2px solid var(--ink);border-radius:22px 18px 24px 16px;padding:20px;background:var(--paper);display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-family:var(--display);font-size:1.5rem;line-height:1.15}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sage);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);overflow-wrap:anywhere}
.toolbar{display:flex;flex-direction:column;gap:10px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.filters button,.btn{font:700 .95rem var(--body);border-radius:999px;padding:10px 12px;border:2px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink);min-height:44px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.item .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .name{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
.chip{font-weight:700;font-size:.78rem;border-radius:999px;padding:3px 10px;border:2px solid var(--ink);white-space:nowrap}
.chip.yes{background:var(--sage)}
.chip.no{background:#fff;color:var(--ink-soft);border-color:var(--line)}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.note{margin:0;font-weight:500;overflow-wrap:anywhere;white-space:pre-wrap}
.time{font-size:.8rem;color:var(--ink-soft);font-weight:600}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--ink-soft);font:600 .85rem var(--body);text-decoration:underline;cursor:pointer;padding:6px 2px;min-height:44px}
.confirm{display:flex;flex-direction:column;gap:8px;background:#fbefec;border-radius:12px;padding:10px 12px}
.confirm p{margin:0;font-weight:600;font-size:.9rem}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--ink-soft);margin:0}
.err{color:var(--danger);font-weight:600;font-size:.9rem;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
label{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
input[type=email],input[type=password]{font:inherit;font-weight:500;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.toast{position:fixed;left:50%;bottom:max(20px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<main class="wrap">
  <img class="deco spin" src="/advent-glow/flake.png" alt="" style="top:0;right:4%;width:14%;max-width:60px">
  <img class="deco twinkle" src="/advent-glow/star.png" alt="" style="top:36px;right:22%;width:8%;max-width:34px">

  <h1>Advent Glow – Antworten</h1>
  <p class="sub">13. Dezember 2026</p>

  <section class="card" id="loading" aria-live="polite">
    <p class="hint" style="margin:0">Einen Moment …</p>
  </section>

  <section class="card" id="denied" hidden>
    <h2>Kein Zugriff</h2>
    <p class="hint" style="margin:0">Diese Seite ist nur für die Gastgeber.</p>
    <form id="login" novalidate style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="email">E-Mail</label><input type="email" id="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="pw">Passwort</label><input type="password" id="pw" autocomplete="current-password"></div>
      <p class="err" id="login-err" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Mit brouBook-Konto anmelden</button>
    </form>
  </section>

  <div id="admin" hidden style="display:flex;flex-direction:column;gap:20px">
    <section class="stats" aria-label="Kennzahlen">
      <div class="stat"><b id="s-yes">0</b><span>Zusagen</span></div>
      <div class="stat"><b id="s-people">0</b><span>Personen gesamt</span></div>
      <div class="stat"><b id="s-no">0</b><span>Absagen</span></div>
      <div class="stat"><b id="s-punch">0</b><span>Alkoholfreier Punsch</span></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter">
          <button type="button" data-filter="all" aria-pressed="true">Alle</button>
          <button type="button" data-filter="yes" aria-pressed="false">Zusagen</button>
          <button type="button" data-filter="no" aria-pressed="false">Absagen</button>
        </div>
        <button type="button" class="btn" id="csv">Als CSV kopieren</button>
      </div>
      <p class="err" id="list-err" hidden></p>
      <p class="hint" id="empty" hidden style="margin:0">Noch keine Antworten.</p>
      <ul class="list" id="list"></ul>
    </section>
    <button type="button" class="link" id="logout" style="align-self:center">Abmelden</button>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
var COLLECTION = "rsvps_adventglow_2026";
var EVENT_ID = "advent-glow-2026";
var SDK = "https://www.gstatic.com/firebasejs/12.9.0/";
var $ = function (id) { return document.getElementById(id); };
var show = function (which) {
  ["loading", "denied", "admin"].forEach(function (id) { $(id).hidden = id !== which; });
};

var fmt = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", dateStyle: "medium", timeStyle: "short" });
var rows = [];          // { id, name, answer, people, nonAlcoholic, note, ms }
var filter = "all";
var pendingDelete = null;
var unsubscribe = null;
var fs, db;

function toast(text) {
  var t = $("toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.hidden = true; }, 2200);
}

function renderStats() {
  var yes = rows.filter(function (r) { return r.answer === "yes"; });
  $("s-yes").textContent = yes.length;
  $("s-people").textContent = yes.reduce(function (a, r) { return a + (r.people || 0); }, 0);
  $("s-no").textContent = rows.length - yes.length;
  $("s-punch").textContent = yes.filter(function (r) { return r.nonAlcoholic; }).length;
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderList() {
  var list = $("list");
  list.textContent = "";
  var shown = rows.filter(function (r) { return filter === "all" || r.answer === filter; });
  $("empty").hidden = shown.length > 0;
  shown.forEach(function (r) {
    var li = el("li", "item");
    var top = el("div", "top");
    top.appendChild(el("span", "name", r.name));
    top.appendChild(el("span", "chip " + (r.answer === "yes" ? "yes" : "no"), r.answer === "yes" ? "Zusage" : "Absage"));
    li.appendChild(top);
    var meta = el("div", "meta");
    if (r.answer === "yes") meta.appendChild(el("span", null, r.people + (r.people === 1 ? " Person" : " Personen")));
    if (r.nonAlcoholic) meta.appendChild(el("span", null, "Alkoholfreier Punsch"));
    if (meta.childNodes.length) li.appendChild(meta);
    if (r.note) li.appendChild(el("p", "note", r.note));
    li.appendChild(el("div", "time", r.ms ? "Zuletzt geändert: " + fmt.format(new Date(r.ms)) : "Wird gespeichert …"));

    if (pendingDelete === r.id) {
      var c = el("div", "confirm");
      c.appendChild(el("p", null, "„" + r.name + "“ endgültig löschen?"));
      var b = el("div", "btns");
      var yes = el("button", "btn danger", "Ja, löschen"); yes.type = "button";
      yes.addEventListener("click", function () { doDelete(r.id, yes); });
      var no = el("button", "btn", "Abbrechen"); no.type = "button";
      no.addEventListener("click", function () { pendingDelete = null; renderList(); });
      b.appendChild(yes); b.appendChild(no); c.appendChild(b); li.appendChild(c);
    } else {
      var a = el("div", "row-actions");
      var del = el("button", "link", "Eintrag löschen"); del.type = "button";
      del.setAttribute("aria-label", r.name + " löschen");
      del.addEventListener("click", function () { pendingDelete = r.id; renderList(); });
      a.appendChild(del); li.appendChild(a);
    }
    list.appendChild(li);
  });
}

async function doDelete(id, btn) {
  btn.disabled = true;
  try {
    await fs.deleteDoc(fs.doc(db, COLLECTION, id));
    pendingDelete = null;
    toast("Gelöscht");
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    $("list-err").textContent = "Löschen hat nicht geklappt.";
    $("list-err").hidden = false;
  }
}

// Spreadsheet formulas from guest input must not run when pasted into Excel/Sheets.
function csvCell(v) {
  var s = String(v == null ? "" : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function toCsv() {
  var head = ["Name", "Antwort", "Personen", "Alkoholfreier Punsch", "Notiz", "Zuletzt geändert"];
  var lines = [head.map(csvCell).join(",")];
  rows.forEach(function (r) {
    lines.push([r.name, r.answer === "yes" ? "Zusage" : "Absage", r.people, r.nonAlcoholic ? "ja" : "nein",
      r.note, r.ms ? fmt.format(new Date(r.ms)) : ""].map(csvCell).join(","));
  });
  return lines.join("\n");
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  var ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

document.querySelectorAll("[data-filter]").forEach(function (b) {
  b.addEventListener("click", function () {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    renderList();
  });
});
$("csv").addEventListener("click", async function () {
  toast((await copyText(toCsv())) ? "CSV kopiert" : "Kopieren nicht möglich");
});

function startListening() {
  if (unsubscribe) unsubscribe();
  // Filtered + limited, sorted client-side: no composite index needed.
  var q = fs.query(fs.collection(db, COLLECTION), fs.where("eventId", "==", EVENT_ID), fs.limit(500));
  unsubscribe = fs.onSnapshot(q, function (snap) {
    $("list-err").hidden = true;
    rows = snap.docs.map(function (d) {
      var x = d.data({ serverTimestamps: "estimate" });
      return {
        id: d.id, name: String(x.name || ""), answer: x.answer === "yes" ? "yes" : "no",
        people: Number(x.people) || 0, nonAlcoholic: !!x.nonAlcoholic, note: String(x.note || ""),
        ms: x.updatedAt && x.updatedAt.toMillis ? x.updatedAt.toMillis() : 0
      };
    }).sort(function (a, b) { return b.ms - a.ms; });
    renderStats(); renderList();
  }, function (err) {
    console.error(err);
    if (err && err.code === "permission-denied") { stopListening(); show("denied"); }
    else { $("list-err").textContent = "Verbindung gestört – Daten sind evtl. nicht aktuell."; $("list-err").hidden = false; }
  });
}
function stopListening() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  rows = [];
}

try {
  var mods = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js")
  ]);
  var authSdk = mods[1];
  fs = mods[2];
  var config = await (await fetch("/__/firebase/init.json", { cache: "no-store" })).json();
  var fbApp = mods[0].initializeApp(config);
  var auth = authSdk.getAuth(fbApp);
  db = fs.getFirestore(fbApp);

  // Admin = users/{uid}.role == "admin" (same check the app's Firestore rules use).
  // The rules enforce it for real; this check only decides what to show.
  var check = 0;
  authSdk.onAuthStateChanged(auth, async function (user) {
    var mine = ++check;
    stopListening();
    if (!user || user.isAnonymous) { show("denied"); return; }
    show("loading");
    var isAdmin = false;
    try {
      var snap = await fs.getDoc(fs.doc(db, "users", user.uid));
      isAdmin = snap.exists() && snap.data().role === "admin";
    } catch (e) { console.error(e); }
    if (mine !== check) return;
    if (!isAdmin) { show("denied"); return; }
    show("admin");
    startListening();
  });

  $("login").addEventListener("submit", async function (e) {
    e.preventDefault();
    var err = $("login-err"), btn = $("login-btn");
    err.hidden = true;
    if (!$("email").value.trim() || !$("pw").value) { err.textContent = "Bitte E-Mail und Passwort eingeben."; err.hidden = false; return; }
    btn.disabled = true;
    try {
      await authSdk.signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value);
      $("pw").value = "";
    } catch (ex) {
      console.error(ex);
      err.textContent = "Anmeldung fehlgeschlagen.";
      err.hidden = false;
    } finally { btn.disabled = false; }
  });
  $("logout").addEventListener("click", function () { authSdk.signOut(auth); });
} catch (e) {
  console.error(e);
  show("denied");
  $("login-err").textContent = "Verbindung zu Firebase fehlgeschlagen. Bitte neu laden.";
  $("login-err").hidden = false;
}
</script>
</body>
</html>
